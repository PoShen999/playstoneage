<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>石器之路 Roguelike 戰鬥原型</title>

<style>
body{
    font-family: Arial,sans-serif;
    background:#1f2937;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:32px;
    margin-bottom:20px;
}

.panel{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:300px;
    background:#374151;
    padding:20px;
    border-radius:12px;
}

.hpbar{
    height:24px;
    background:#222;
    border-radius:12px;
    overflow:hidden;
    margin-top:10px;
}

.hpfill{
    height:100%;
    background:#22c55e;
    width:100%;
    transition:.3s;
}

.actions{
    margin-top:20px;
}

button{
    padding:10px 16px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.attack{background:#ef4444;color:white;}
.pet{background:#3b82f6;color:white;}
.defend{background:#6b7280;color:white;}
.catch{background:#f59e0b;color:white;}

.log{
    margin-top:20px;
    background:#111827;
    height:250px;
    overflow-y:auto;
    padding:10px;
    border-radius:10px;
}

.log div{
    margin-bottom:5px;
}
</style>
</head>

<body>

<div class="container">

<div class="title">
🦖 石器之路 - 戰鬥原型
</div>

<div class="panel">

<div class="card">
<h2>玩家</h2>

<div>職業：獵人</div>
<div>HP：<span id="playerHpText">100</span>/100</div>

<div class="hpbar">
<div id="playerBar" class="hpfill"></div>
</div>

<hr>

<div>夥伴寵物：暴龍</div>
<div>HP：<span id="petHpText">80</span>/80</div>

<div class="hpbar">
<div id="petBar" class="hpfill"></div>
</div>
</div>

<div class="card">
<h2 id="enemyName">迅猛龍</h2>

<div>HP：<span id="enemyHpText">120</span>/120</div>

<div class="hpbar">
<div id="enemyBar" class="hpfill"></div>
</div>

<p id="captureHint">
低於30%血量可提高捕獲成功率
</p>
</div>

</div>

<div class="actions">
<button class="attack" onclick="playerAttack()">
🪓 石斧攻擊
</button>

<button class="pet" onclick="petAttack()">
🦖 暴龍撕咬
</button>

<button class="defend" onclick="defend()">
🛡️ 防禦
</button>

<button class="catch" onclick="catchPet()">
🦴 捕捉
</button>
</div>

<div class="log" id="log"></div>

</div>

<script>

const enemies = [
    {name:"迅猛龍", hp:120},
    {name:"劍齒虎", hp:140},
    {name:"雷暴龍", hp:180}
];

const enemy =
enemies[Math.floor(Math.random()*enemies.length)];

let playerHp = 100;
let petHp = 80;

let enemyHp = enemy.hp;
let enemyMaxHp = enemy.hp;

let defending = false;
let gameOver = false;

document.getElementById("enemyName").innerText =
enemy.name;

function log(text){
    const div=document.createElement("div");
    div.innerHTML=text;
    document.getElementById("log").prepend(div);
}

function updateUI(){

    document.getElementById("playerHpText").innerText =
    Math.max(0,playerHp);

    document.getElementById("petHpText").innerText =
    Math.max(0,petHp);

    document.getElementById("enemyHpText").innerText =
    Math.max(0,enemyHp);

    document.getElementById("playerBar").style.width=
    (playerHp/100*100)+"%";

    document.getElementById("petBar").style.width=
    (petHp/80*100)+"%";

    document.getElementById("enemyBar").style.width=
    (enemyHp/enemyMaxHp*100)+"%";
}

function enemyTurn(){

    if(gameOver || enemyHp<=0) return;

    let damage =
    Math.floor(Math.random()*12)+8;

    if(defending){
        damage=Math.floor(damage/2);
    }

    playerHp -= damage;

    log(
    enemy.name+
    " 攻擊造成 <b>"+damage+
    "</b> 點傷害"
    );

    defending=false;

    if(playerHp<=0){

        gameOver=true;

        log("💀 你被擊敗了");
    }

    updateUI();
}

function playerAttack(){

    if(gameOver) return;

    const damage =
    Math.floor(Math.random()*15)+10;

    enemyHp -= damage;

    log(
    "🪓 石斧造成 <b>"+damage+
    "</b> 點傷害"
    );

    if(enemyHp<=0){

        enemyHp=0;
        gameOver=true;

        log("🏆 戰鬥勝利！");
        updateUI();
        return;
    }

    updateUI();
    enemyTurn();
}

function petAttack(){

    if(gameOver) return;

    const damage =
    Math.floor(Math.random()*20)+15;

    enemyHp -= damage;

    log(
    "🦖 暴龍撕咬造成 <b>"+damage+
    "</b> 點傷害"
    );

    if(enemyHp<=0){

        enemyHp=0;
        gameOver=true;

        log("🏆 戰鬥勝利！");
        updateUI();
        return;
    }

    updateUI();
    enemyTurn();
}

function defend(){

    if(gameOver) return;

    defending=true;

    log("🛡️ 進入防禦姿態");

    enemyTurn();
}

function catchPet(){

    if(gameOver) return;

    const hpRatio =
    enemyHp / enemyMaxHp;

    let chance;

    if(hpRatio > 0.3){

        chance = 15;

    }else{

        chance =
        60 +
        Math.floor(
        ((enemyMaxHp-enemyHp)
        /enemyMaxHp)*30
        );
    }

    const roll =
    Math.random()*100;

    if(roll < chance){

        gameOver=true;

        log(
        "🎉 成功捕獲 "+
        enemy.name+
        "！"
        );

    }else{

        log(
        "❌ 捕捉失敗 (成功率 "
        +chance+"%)"
        );

        enemyTurn();
    }

    updateUI();
}

updateUI();

log("🔥 遭遇野生 " + enemy.name);

</script>

</body>
</html>

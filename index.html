<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>石器之路 Prototype</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#1e293b;
    color:white;
    font-family:Arial;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:100;
}

canvas{
    background:#355e3b;
    display:block;
}

</style>
</head>
<body>

<div id="ui">
    <div>LV <span id="level">1</span></div>
    <div>HP <span id="hp">100</span></div>
    <div>EXP <span id="exp">0</span>/100</div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const keys={};

let player={
    x:400,
    y:300,
    r:18,
    hp:100,
    maxHp:100,
    atk:15,
    speed:4,
    exp:0,
    level:1,
    lastAttack:0
};

let pet={
    x:360,
    y:300,
    r:14,
    atk:10,
    speed:3,
    lastAttack:0
};

const monsters=[];
const damages=[];

function spawnMonster(){

    monsters.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:16,
        hp:40,
        maxHp:40,
        atk:5,
        speed:1+Math.random()
    });

}

for(let i=0;i<10;i++){
    spawnMonster();
}

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function dist(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}

function damageText(x,y,text,color){

    damages.push({
        x,y,
        text,
        color,
        life:40
    });

}

function levelUp(){

    player.level++;
    player.exp=0;

    player.maxHp+=20;
    player.hp=player.maxHp;

    player.atk+=5;

}

function updatePlayer(){

    if(keys["w"]) player.y-=player.speed;
    if(keys["s"]) player.y+=player.speed;
    if(keys["a"]) player.x-=player.speed;
    if(keys["d"]) player.x+=player.speed;

}

function updatePet(){

    let dx=player.x-50-pet.x;
    let dy=player.y-pet.y;

    pet.x+=dx*0.05;
    pet.y+=dy*0.05;

}

function updateMonsters(){

    monsters.forEach(mon=>{

        let dx=player.x-mon.x;
        let dy=player.y-mon.y;

        let len=Math.hypot(dx,dy);

        if(len>0){

            mon.x+=dx/len*mon.speed;
            mon.y+=dy/len*mon.speed;

        }

        let now=Date.now();

        if(dist(player,mon)<player.r+mon.r){

            if(now-player.lastAttack>500){

                mon.hp-=player.atk;

                damageText(
                    mon.x,
                    mon.y,
                    "-"+player.atk,
                    "yellow"
                );

                player.lastAttack=now;

            }

            player.hp-=0.2;

        }

        if(dist(pet,mon)<pet.r+mon.r){

            if(now-pet.lastAttack>700){

                mon.hp-=pet.atk;

                damageText(
                    mon.x,
                    mon.y,
                    "-"+pet.atk,
                    "cyan"
                );

                pet.lastAttack=now;

            }

        }

    });

    for(let i=monsters.length-1;i>=0;i--){

        if(monsters[i].hp<=0){

            monsters.splice(i,1);

            player.exp+=20;

            spawnMonster();

            if(player.exp>=100){

                levelUp();

            }

        }

    }

}

function updateDamageTexts(){

    for(let i=damages.length-1;i>=0;i--){

        damages[i].y-=1;
        damages[i].life--;

        if(damages[i].life<=0){

            damages.splice(i,1);

        }

    }

}

function drawPlayer(){

    ctx.fillStyle="#fbbf24";

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.r,
        0,
        Math.PI*2
    );
    ctx.fill();

}

function drawPet(){

    ctx.fillStyle="#ef4444";

    ctx.beginPath();
    ctx.arc(
        pet.x,
        pet.y,
        pet.r,
        0,
        Math.PI*2
    );
    ctx.fill();

}

function drawMonsters(){

    monsters.forEach(mon=>{

        ctx.fillStyle="#111827";

        ctx.beginPath();
        ctx.arc(
            mon.x,
            mon.y,
            mon.r,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.fillStyle="red";
        ctx.fillRect(
            mon.x-20,
            mon.y-25,
            40,
            4
        );

        ctx.fillStyle="lime";

        ctx.fillRect(
            mon.x-20,
            mon.y-25,
            40*(mon.hp/mon.maxHp),
            4
        );

    });

}

function drawDamageTexts(){

    damages.forEach(d=>{

        ctx.fillStyle=d.color;

        ctx.fillText(
            d.text,
            d.x,
            d.y
        );

    });

}

function gameOver(){

    ctx.fillStyle="white";

    ctx.font="60px Arial";

    ctx.fillText(
        "GAME OVER",
        canvas.width/2-180,
        canvas.height/2
    );

}

function updateUI(){

    hp.innerText=Math.floor(player.hp);
    exp.innerText=player.exp;
    level.innerText=player.level;

}

function loop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(player.hp<=0){

        gameOver();
        return;

    }

    updatePlayer();
    updatePet();
    updateMonsters();
    updateDamageTexts();

    drawPlayer();
    drawPet();
    drawMonsters();
    drawDamageTexts();

    updateUI();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>

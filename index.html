<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
StoneAge Roguelike v0.15
</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#224433;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{

    position:absolute;

    top:20px;
    left:20px;

    z-index:10;

    color:white;

    font-size:28px;

    text-shadow:
    2px 2px 4px #000;
}

#levelup,
#pauseMenu,
#gameOverMenu{

    display:none;

    position:absolute;

    inset:0;

    background:
    rgba(0,0,0,.85);

    z-index:100;

    justify-content:center;

    align-items:center;

    flex-direction:column;
}

#levelup h1,
#pauseMenu h1,
#gameOverMenu h1{

    color:white;

    margin-bottom:30px;
}

.talent,
#pauseMenu button,
#gameOverMenu button{

    width:320px;

    margin:10px;

    padding:15px;

    border:none;

    border-radius:12px;

    font-size:20px;

    cursor:pointer;
}

</style>

</head>

<body>

<div id="ui">

<div>
LV <span id="level">1</span>
</div>

<div>
HP <span id="hp">100</span>
</div>

<div>
ATK <span id="atk">15</span>
</div>

<div>
XP <span id="exp">0</span>/100
</div>

</div>


<div id="levelup">

<h1>
🎉 升級！選擇天賦
</h1>

<div id="choices"></div>

</div>


<div id="pauseMenu">

<h1>
⏸ 遊戲暫停
</h1>

<button onclick="resumeGame()">

繼續遊戲

</button>

</div>


<div id="gameOverMenu">

<h1>
💀 GAME OVER
</h1>

<button
onclick="restartGame()">

重新開始

</button>

</div>


<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById(
"game"
);

const ctx =
canvas.getContext(
"2d"
);

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const keys={};

let paused=false;
let levelChoosing=false;
let gameOver=false;

const player={

x:400,
y:300,

r:18,

hp:100,
maxHp:100,

atk:15,

speed:4,

exp:0,

level:1,

lastAttack:0

};

const pet={

x:350,
y:300,

r:14,

atk:10,

lastAttack:0

};

const monsters=[];
const damages=[];

const talents=[

{
name:"力量強化",

desc:"+5攻擊",

apply(){

player.atk+=5;

}
},

{
name:"生命強化",

desc:"+30生命",

apply(){

player.maxHp+=30;

player.hp+=30;

}
},

{
name:"疾風步",

desc:"+1速度",

apply(){

player.speed+=1;

}
},

{
name:"暴龍成長",

desc:"+5寵物攻擊",

apply(){

pet.atk+=5;

}
}

];

function spawnMonster(){

let x;
let y;

do{

x=
Math.random()
*
canvas.width;

y=
Math.random()
*
canvas.height;

}while(

Math.hypot(

x-player.x,

y-player.y

)

< 200

);

monsters.push({

x,
y,

r:16,

hp:40,

maxHp:40,

speed:
1+Math.random()

});

}

for(
let i=0;
i<12;
i++
){

spawnMonster();

}

addEventListener(
"keydown",
e=>{

const key=
e.key.toLowerCase();

keys[key]=true;

if(
e.key==="Escape"
){

togglePause();

}

});

addEventListener(
"keyup",
e=>{

keys[
e.key.toLowerCase()
]=false;

});

function togglePause(){

if(
levelChoosing ||
gameOver
)
return;

paused=!paused;

document
.getElementById(
"pauseMenu"
)
.style.display=

paused
?
"flex"
:
"none";

}

function resumeGame(){

paused=false;

document
.getElementById(
"pauseMenu"
)
.style.display=
"none";

}

function dist(a,b){

return Math.hypot(

a.x-b.x,

a.y-b.y

);

}

function dmg(
x,
y,
text,
color
){

damages.push({

x,
y,

text,
color,

life:40

});

}

function drawDamage(){

ctx.font=
"18px Arial";

damages.forEach(
d=>{

ctx.fillStyle=
d.color;

ctx.fillText(

d.text,

d.x,

d.y

);

d.y-=1;

d.life--;

});

for(
let i=
damages.length-1;
i>=0;
i--
){

if(
damages[i].life<=0
){

damages.splice(
i,
1
);

}

}

}

function chooseTalent(){

paused=true;

levelChoosing=true;

const panel=

document
.getElementById(
"levelup"
);

const choices=

document
.getElementById(
"choices"
);

choices.innerHTML=
"";

panel.style.display=
"flex";

const picks=[];

while(
picks.length<3
){

const t=

talents[
Math.floor(
Math.random()
*
talents.length
)
];

if(
!picks.includes(t)
){

picks.push(t);

}

}

picks.forEach(
t=>{

const btn=

document
.createElement(
"button"
);

btn.className=
"talent";

btn.innerHTML=

"<b>"
+t.name+
"</b><br>"
+t.desc;

btn.onclick=()=>{

t.apply();

panel.style.display=
"none";

paused=false;

levelChoosing=false;

};

choices.appendChild(
btn
);

});

}
function levelUp(){

    player.level++;

    player.exp-=100;

    player.hp=
    player.maxHp;

    chooseTalent();

}

function updatePlayer(){

    if(keys["w"])
        player.y-=player.speed;

    if(keys["s"])
        player.y+=player.speed;

    if(keys["a"])
        player.x-=player.speed;

    if(keys["d"])
        player.x+=player.speed;


    player.x=Math.max(
        player.r,
        Math.min(
            canvas.width-player.r,
            player.x
        )
    );

    player.y=Math.max(
        player.r,
        Math.min(
            canvas.height-player.r,
            player.y
        )
    );
}

function updatePet(){

    let target=null;
    let nearest=999999;

    monsters.forEach(mon=>{

        const d=Math.hypot(

            mon.x-pet.x,

            mon.y-pet.y

        );

        if(
            d < nearest &&
            d < 200
        ){

            nearest=d;

            target=mon;
        }

    });

    if(target){

        const dx=
        target.x-pet.x;

        const dy=
        target.y-pet.y;

        const len=
        Math.hypot(dx,dy);

        if(len>0){

            pet.x +=
            dx/len*3;

            pet.y +=
            dy/len*3;
        }

    }else{

        pet.x +=
        (player.x-40-pet.x)
        *0.05;

        pet.y +=
        (player.y-pet.y)
        *0.05;
    }
}

function updateMonsters(){

    monsters.forEach(mon=>{

        const dx=
        player.x-mon.x;

        const dy=
        player.y-mon.y;

        const len=
        Math.hypot(
            dx,
            dy
        );

        if(len>0){

            mon.x +=
            dx/len*
            mon.speed;

            mon.y +=
            dy/len*
            mon.speed;
        }

        const now=
        Date.now();

        if(
            dist(player,mon)
            <
            player.r+mon.r
        ){

            if(
                now-player.lastAttack
                >
                500
            ){

                mon.hp -=
                player.atk;

                dmg(
                    mon.x,
                    mon.y,

                    "-"+
                    player.atk,

                    "yellow"
                );

                player.lastAttack=
                now;
            }

            player.hp-=0.2;
        }

        if(
            dist(pet,mon)
            <
            pet.r+mon.r
        ){

            if(
                now-pet.lastAttack
                >
                700
            ){

                mon.hp -=
                pet.atk;

                dmg(
                    mon.x,
                    mon.y,

                    "-"+
                    pet.atk,

                    "#00FFFF"
                );

                pet.lastAttack=
                now;
            }
        }

    });

    for(
        let i=
        monsters.length-1;
        i>=0;
        i--
    ){

        if(
            monsters[i].hp<=0
        ){

            monsters.splice(
                i,
                1
            );

            player.exp+=20;

            spawnMonster();

            if(
                player.exp>=100
            ){

                levelUp();

            }
        }
    }
}

function drawCircle(
x,
y,
r,
color
){

    ctx.fillStyle=
    color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();
}

function render(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawCircle(

        player.x,
        player.y,

        player.r,

        "#FFD700"

    );

    drawCircle(

        pet.x,
        pet.y,

        pet.r,

        "#FF4444"

    );

    monsters.forEach(
    mon=>{

        drawCircle(

            mon.x,
            mon.y,

            mon.r,

            "#222"

        );

        ctx.fillStyle=
        "lime";

        ctx.fillRect(

            mon.x-20,

            mon.y-25,

            40*
            (
                mon.hp/
                mon.maxHp
            ),

            4
        );

    });

    drawDamage();

    if(
        paused &&
        !levelChoosing
    ){

        ctx.fillStyle=
        "white";

        ctx.font=
        "50px Arial";

        ctx.fillText(

            "PAUSED",

            canvas.width/2-110,

            100

        );
    }
}

function updateUI(){

    document
    .getElementById(
        "level"
    )
    .textContent=
    player.level;

    document
    .getElementById(
        "hp"
    )
    .textContent=
    Math.floor(
        player.hp
    );

    document
    .getElementById(
        "atk"
    )
    .textContent=
    player.atk;

    document
    .getElementById(
        "exp"
    )
    .textContent=
    player.exp;
}

function restartGame(){

    location.reload();

}

function gameLoop(){

    if(
        player.hp<=0 &&
        !gameOver
    ){

        gameOver=true;

        document
        .getElementById(
            "gameOverMenu"
        )
        .style.display=
        "flex";
    }

    if(
        !paused &&
        !gameOver
    ){

        updatePlayer();

        updatePet();

        updateMonsters();
    }

    render();

    updateUI();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

</script>

</body>
</html>
